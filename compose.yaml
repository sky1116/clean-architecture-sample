# Local development database only. Never use this file for production deployment.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: competitions
      POSTGRES_DB: competitions
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong local POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U competitions -d competitions"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - competition_db:/var/lib/postgresql/data

volumes:
  competition_db:
