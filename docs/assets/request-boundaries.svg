<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc"><title id="title">Clean Architecture typical scenario</title><desc id="desc">Controller calls application input boundary and interactor. The interactor invokes entities, sends response data to the output boundary implemented by presenter, and uses an application-owned data gateway implemented by infrastructure. Arrows distinguish runtime control and inward source dependencies.</desc><rect width="1160" height="600" rx="18" fill="#f8fafc"/><text x="28" y="44" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">A typical scenario: input, output and persistence boundaries</text><g font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f172a" stroke="#334155" stroke-width="2"><rect x="35" y="90" width="155" height="66" rx="8" fill="#a7f3d0"/><text x="112" y="129" text-anchor="middle" stroke="none">Controller</text><rect x="243" y="90" width="163" height="66" rx="8" fill="#fecaca"/><text x="324" y="116" text-anchor="middle" stroke="none">Input Boundary</text><text x="324" y="137" text-anchor="middle" stroke="none">(input port)</text><rect x="456" y="90" width="177" height="66" rx="8" fill="#fecaca"/><text x="544" y="117" text-anchor="middle" stroke="none">Use Case</text><text x="544" y="137" text-anchor="middle" stroke="none">Interactor</text><rect x="697" y="90" width="150" height="66" rx="8" fill="#fef08a"/><text x="772" y="128" text-anchor="middle" stroke="none">Entities</text><rect x="456" y="239" width="177" height="66" rx="8" fill="#fecaca"/><text x="544" y="264" text-anchor="middle" stroke="none">Output Boundary</text><text x="544" y="284" text-anchor="middle" stroke="none">(output port)</text><rect x="243" y="239" width="163" height="66" rx="8" fill="#a7f3d0"/><text x="324" y="276" text-anchor="middle" stroke="none">Presenter</text><rect x="35" y="239" width="155" height="66" rx="8" fill="#a7f3d0"/><text x="112" y="275" text-anchor="middle" stroke="none">View Model</text><rect x="456" y="394" width="177" height="66" rx="8" fill="#fecaca"/><text x="544" y="419" text-anchor="middle" stroke="none">Data Gateway</text><text x="544" y="439" text-anchor="middle" stroke="none">(port)</text><rect x="697" y="394" width="178" height="66" rx="8" fill="#a5d8ff"/><text x="786" y="421" text-anchor="middle" stroke="none">Repository Adapter</text><rect x="942" y="394" width="167" height="66" rx="8" fill="#a5d8ff"/><text x="1025" y="433" text-anchor="middle" stroke="none">Database</text></g><g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#head)"><path d="M190 123H243"/><path d="M406 123H456"/><path d="M633 123H697"/><path d="M544 156V239"/><path d="M456 272H406"/><path d="M243 272H190"/><path d="M544 156V394"/><path d="M633 427H697"/><path d="M875 427H942"/></g><g font-family="Arial,sans-serif" font-size="14" fill="#475569"><text x="98" y="80">HTTP adapter</text><text x="480" y="82">Application policy</text><text x="484" y="382">Application-owned port</text><text x="706" y="382">Infrastructure detail</text><text x="36" y="347">View/HTTP response is produced by the outer host.</text><text x="36" y="370">Solid arrows: simplified runtime collaboration, not source-reference direction.</text><text x="36" y="542">Compile-time references follow the dependency rule: implementations depend on inner boundary interfaces.</text></g><defs><marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker></defs></svg>
