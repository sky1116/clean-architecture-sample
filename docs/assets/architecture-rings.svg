<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Clean Architecture, inward source dependencies</title><desc id="desc">Four concentric rings. Frameworks and Drivers depend on Interface Adapters, which depend on Use Cases, which depend on Entities. The inward arrows are source-code dependencies.</desc><rect width="1000" height="540" rx="22" fill="#0f172a"/><text x="48" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#f8fafc">The dependency rule</text><g transform="translate(325 288)"><circle r="205" fill="#a5d8ff" stroke="#f8fafc" stroke-width="3"/><circle r="157" fill="#a7f3d0" stroke="#0f172a" stroke-width="2"/><circle r="107" fill="#fecaca" stroke="#0f172a" stroke-width="2"/><circle r="58" fill="#fef08a" stroke="#0f172a" stroke-width="2"/><text y="-166" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Frameworks &amp; Drivers</text><text y="-118" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold">Interface Adapters</text><text y="-70" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Use Cases</text><text y="5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Entities</text><g stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"><path d="M0 190V155m-8 10 8-10 8 10"/><path d="M0 140V105m-8 10 8-10 8 10"/><path d="M0 92V56m-8 10 8-10 8 10"/></g></g><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="575" y="135" font-size="22" font-weight="bold">Only inward source dependencies</text><text x="575" y="183" font-size="18">Entities: independent business policy</text><text x="575" y="226" font-size="18">Use Cases: application-specific policy</text><text x="575" y="269" font-size="18">Adapters: translation and presentation</text><text x="575" y="312" font-size="18">Drivers: web, persistence, telemetry</text><text x="575" y="382" font-size="16" fill="#cbd5e1">Runtime calls can cross boundaries</text><text x="575" y="408" font-size="16" fill="#cbd5e1">through inward-owned interfaces.</text></g><text x="42" y="517" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">Original explanatory drawing inspired by Robert C. Martin's Clean Architecture; not book artwork.</text></svg>
