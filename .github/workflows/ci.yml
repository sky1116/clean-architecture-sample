name: Build and verify
on:
  push:
    branches: [main, feat/competition-platform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Domain tests
        run: dotnet test tests/Competition.Domain.Tests/Competition.Domain.Tests.csproj --configuration Release
      - name: Publication hygiene
        run: python3 scripts/check_publication.py
